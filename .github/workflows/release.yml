name: Publish release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Gate the tag and fetch the tested archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag and project version differ." >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          ci="$(gh run list --workflow ci.yml --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          archives="$(gh run list --workflow archives.yml --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$ci" || -z "$archives" ]]; then
            echo "Both CI and archive verification must pass for $commit before release." >&2
            exit 1
          fi
          gh run download "$archives" --pattern 'archive-*' --dir verified
          mkdir dist
          mv "verified/archive-win-x64/Plico-$version-win-x64.zip" dist/
          mv "verified/archive-win-x64/Plico-$version-win-x64-setup.exe" dist/
          mv "verified/archive-osx-arm64/Plico-$version-osx-arm64.zip" dist/
          mv "verified/archive-linux-x64/Plico-$version-linux-x64.tar.gz" dist/
          (cd dist && sha256sum Plico-* > SHA256SUMS)
          awk -v version="$version" 'index($0, "## [" version "]") == 1 {printing=1; next} /^## / && printing {exit} printing {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nVerified by [CI run %s](%s/%s/actions/runs/%s) and [archive run %s](%s/%s/actions/runs/%s).\n' \
            "$ci" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$ci" "$archives" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$archives" >> release-notes.md
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/Plico-* dist/SHA256SUMS \
            --verify-tag --title "Plico $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"

  smoke:
    needs: publish
    name: Published archive (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, rid: win-x64, extension: zip}
          - {runner: macos-26, rid: osx-arm64, extension: zip}
          - {runner: ubuntu-24.04, rid: linux-x64, extension: tar.gz}
    steps:
      - uses: actions/checkout@v6
      - name: Download, check the checksum, and open the released copy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLICO_RUNTIME: ${{ matrix.rid }}
          PLICO_EXTENSION: ${{ matrix.extension }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "Plico-$version-$env:PLICO_RUNTIME.$env:PLICO_EXTENSION"
          $setup = "Plico-$version-win-x64-setup.exe"
          $names = @($name)
          if ($IsWindows) { $names += $setup }
          $downloadArguments = @('release', 'download', $env:GITHUB_REF_NAME, '--pattern', 'SHA256SUMS', '--dir', 'incoming')
          foreach ($assetName in $names) { $downloadArguments += @('--pattern', $assetName) }
          gh @downloadArguments
          $checksums = Get-Content -LiteralPath incoming/SHA256SUMS
          foreach ($assetName in $names) {
              $checksum = $checksums | Where-Object { $_.EndsWith("  $assetName") }
              if (-not $checksum -or (Get-FileHash -LiteralPath (Join-Path incoming $assetName)).Hash -ne ($checksum -split ' +')[0]) {
                  throw "$assetName failed its SHA-256 check."
              }
          }
          ./scripts/Test-Archive.ps1 -Archive (Join-Path incoming $name) -EvidenceDirectory artifacts/release/extracted
          if ($IsWindows) {
              ./scripts/Test-WindowsInstaller.ps1 -Installer (Join-Path incoming $setup) -EvidenceDirectory artifacts/release/setup
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: ignore
