name: Publish release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Gate the tag and fetch the tested archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag and project version differ." >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          verification_run="$(gh run list --workflow archives.yml --event workflow_dispatch --commit "$commit" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$verification_run" ]]; then
            echo "Release candidate verification must pass for $commit before release." >&2
            exit 1
          fi
          gh run download "$verification_run" --pattern 'archive-*' --dir verified
          mkdir dist
          for target in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            case "$target" in
              win-*) suffixes=(.zip -setup.exe) ;;
              osx-*) suffixes=(.zip .dmg) ;;
              linux-*) suffixes=(.tar.gz .deb) ;;
            esac
            for suffix in "${suffixes[@]}"; do
              mv "verified/archive-$target/Plico-$version-$target$suffix" dist/
            done
          done
          (cd dist && sha256sum Plico-* > SHA256SUMS)
          awk -v version="$version" 'index($0, "## [" version "]") == 1 {printing=1; next} /^## / && printing {exit} printing {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nSource tests, portable launches, and installer checks passed in [candidate run %s](%s/%s/actions/runs/%s).\n' \
            "$verification_run" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$verification_run" >> release-notes.md
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/Plico-* dist/SHA256SUMS \
            --verify-tag --title "Plico $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"

  smoke:
    needs: publish
    name: Published archive (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, rid: win-x64, extension: zip, installer_suffix: -setup.exe}
          - {runner: windows-11-arm, rid: win-arm64, extension: zip, installer_suffix: -setup.exe}
          - {runner: macos-26, rid: osx-arm64, extension: zip, installer_suffix: .dmg}
          - {runner: macos-26-intel, rid: osx-x64, extension: zip, installer_suffix: .dmg}
          - {runner: ubuntu-24.04, rid: linux-x64, extension: tar.gz, installer_suffix: .deb}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64, extension: tar.gz, installer_suffix: .deb}
    steps:
      - uses: actions/checkout@v6
      - name: Download, check the checksum, and open the released copy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLICO_RUNTIME: ${{ matrix.rid }}
          PLICO_EXTENSION: ${{ matrix.extension }}
          PLICO_INSTALLER_SUFFIX: ${{ matrix.installer_suffix }}
          PLICO_EXPECTED_NATIVE_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $prefix = "Plico-$version-$env:PLICO_RUNTIME"
          $names = @("$prefix.$env:PLICO_EXTENSION", "$prefix$env:PLICO_INSTALLER_SUFFIX")
          $downloadArguments = @('release', 'download', $env:GITHUB_REF_NAME, '--pattern', 'SHA256SUMS', '--dir', 'incoming')
          foreach ($assetName in $names) { $downloadArguments += @('--pattern', $assetName) }
          gh @downloadArguments
          $checksums = Get-Content -LiteralPath incoming/SHA256SUMS
          foreach ($assetName in $names) {
              $checksum = $checksums | Where-Object { $_.EndsWith("  $assetName") }
              if (-not $checksum -or (Get-FileHash -LiteralPath (Join-Path incoming $assetName)).Hash -ne ($checksum -split ' +')[0]) {
                  throw "$assetName failed its SHA-256 check."
              }
          }
          ./scripts/Test-Distribution.ps1 -Directory incoming -EvidenceDirectory artifacts/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: ignore
