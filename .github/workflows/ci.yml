name: Diagnose Tesseract orientation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact feature commit to diagnose
        required: true
        type: string
permissions:
  contents: read
jobs:
  orientation:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Capture Plico's orientation subprocess output
        env:
          PLICO_OSD_LOG: ${{ runner.temp }}/plico-osd.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          implementation = Path('src/Plico.Core/TesseractOrientation.cs')
          source = implementation.read_text()
          old = 'return process.ExitCode == 0 ? ReadRotation(await output.ConfigureAwait(false)) : 0;'
          new = '''var stdout = await output.ConfigureAwait(false);
                      var stderr = await diagnostics.ConfigureAwait(false);
                      string capture = Environment.GetEnvironmentVariable("PLICO_OSD_LOG")!;
                      File.AppendAllText(capture, $"exit={process.ExitCode}\\nstdout:\\n{stdout}\\nstderr:\\n{stderr}\\n");
                      return process.ExitCode == 0 ? ReadRotation(stdout) : 0;'''
          assert source.count(old) == 1
          implementation.write_text(source.replace(old, new))
          PY
          dotnet test Plico.slnx -c Release --filter FullyQualifiedName~AutoOrientationTurns || true
          if test -f "$PLICO_OSD_LOG"; then cat "$PLICO_OSD_LOG"; fi
          native_dir="_linux"
          if test "$(uname -m)" = aarch64; then native_dir="_linuxarm"; fi
          tesseract="src/Plico.Desktop/bin/Release/net10.0/$native_dir/tesseract"
          "$tesseract" --version
          "$tesseract" --help-psm
          "$tesseract" 'tests/fixtures/Sideways orientation.png' stdout --tessdata-dir assets/ocr --dpi 300 --psm 0 || true
