name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.agents/**']
  pull_request:
    paths-ignore: ['**/*.md', '.agents/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, rid: win-x64, executable: Plico.exe}
          - {runner: windows-11-arm, rid: win-arm64, executable: Plico.exe}
          - {runner: macos-26, rid: osx-arm64, executable: Plico}
          - {runner: macos-26-intel, rid: osx-x64, executable: Plico}
          - {runner: ubuntu-24.04, rid: linux-x64, executable: Plico}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64, executable: Plico}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - run: dotnet test Plico.slnx -c Release --no-restore
      - name: Launch native window
        shell: pwsh
        env:
          PLICO_EXECUTABLE: ${{ matrix.executable }}
          PLICO_EXPECTED_NATIVE_RID: ${{ matrix.rid }}
        run: |
          $executable = "src/Plico.Desktop/bin/Release/net10.0/$env:PLICO_EXECUTABLE"
          if ($IsLinux) {
            xvfb-run -a pwsh -NoProfile -File scripts/Test-Native.ps1 -Executable $executable -EvidenceDirectory artifacts/native
          } else {
            ./scripts/Test-Native.ps1 -Executable $executable -EvidenceDirectory artifacts/native
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/
          if-no-files-found: ignore
