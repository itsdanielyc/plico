name: Diagnose Tesseract orientation on Intel Macs
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact OCR commit to diagnose
        required: true
        type: string
permissions:
  contents: read
jobs:
  orientation:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Record the bundle output for each quarter-turn
        env:
          PLICO_OSD_PROBE: ${{ runner.temp }}/plico-osd
        run: |
          mkdir -p "$PLICO_OSD_PROBE"
          python3 - <<'PY'
          from pathlib import Path
          implementation = Path('src/Plico.Core/TesseractOrientation.cs')
          source = implementation.read_text()
          old = 'return new ProbeOutput(process.ExitCode, await output.ConfigureAwait(false), await diagnostics.ConfigureAwait(false));'
          new = '''var response = new ProbeOutput(process.ExitCode, await output.ConfigureAwait(false), await diagnostics.ConfigureAwait(false));
                      string prefix = Path.Combine(Environment.GetEnvironmentVariable("PLICO_OSD_PROBE")!, Guid.NewGuid().ToString("N"));
                      File.Copy(input, prefix + ".png");
                      File.WriteAllText(prefix + ".txt", $"Runtime {RuntimeInformation.RuntimeIdentifier}, binary {executable}\\n{string.Join(" ", start.ArgumentList)}\\nexit={response.ExitCode}\\nstderr:\\n{response.Diagnostics}\\nstdout:\\n{response.Text}");
                      return response;'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          source = source.replace('if (result.ExitCode != 0) return 0;', 'if (result.ExitCode != 0) continue;')
          source = source.replace('var score = ScoreSample(result.Text, degrees);', '''var score = ScoreSample(result.Text, degrees);
                      File.AppendAllText(Path.Combine(Environment.GetEnvironmentVariable("PLICO_OSD_PROBE")!, "scores.txt"),
                          $"rotation={degrees} words={score.Words} weight={score.Weight}\\n");''')
          implementation.write_text(source)
          PY
          dotnet test Plico.slnx -c Release --filter 'FullyQualifiedName~OrientationWorksWithoutOsd|FullyQualifiedName~AutoOrientationTurns' || true
          tesseract="src/Plico.Desktop/bin/Release/net10.0/_mac/tesseract"
          uname -sm
          ls -l "$tesseract"
          "$tesseract" --version || true
          "$tesseract" 'tests/fixtures/Sideways orientation.png' stdout --tessdata-dir assets/ocr --dpi 300 --psm 0 || true
          for report in "$PLICO_OSD_PROBE"/*.txt; do
            echo "--- $(basename "$report") ---"
            head -n 22 "$report"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: orientation-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/plico-osd
