name: Verify the truncated feeder on Intel macOS
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact scanner test commit to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  feeder:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - name: Repeat exact interrupted feeder cases twenty times
        run: |
          filter=FullyQualifiedName~InterruptedFeederCanSaveCompletedPagesOrDiscardThem
          dotnet test Plico.slnx -c Release --no-restore --filter "$filter"
          for pass in $(seq 2 20); do
            echo "Feeder check $pass of 20"
            dotnet test Plico.slnx -c Release --no-build --no-restore --filter "$filter"
          done
      - name: Package and verify Image Capture
        shell: pwsh
        env:
          PLICO_EXPECTED_NATIVE_RID: osx-x64
        run: |
          ./scripts/Package.ps1 -Runtime osx-x64
          ./scripts/Test-Distribution.ps1 -Directory artifacts/archives -EvidenceDirectory artifacts/install
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intel-scanner-native
          path: artifacts/install/
          if-no-files-found: ignore
