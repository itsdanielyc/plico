name: Supplementary Apple silicon capture verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact feature commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  apple-silicon:
    name: macOS 15 arm64 (${{ inputs.source_sha }})
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Confirm the checked-out commit
        shell: pwsh
        env:
          PLICO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -cne $env:PLICO_SOURCE_SHA) { throw "Wrong source commit: $actual" }
          "Verified source checkout $actual" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - run: dotnet test Plico.slnx -c Release --no-restore
      - name: Launch native window
        shell: pwsh
        env:
          PLICO_EXPECTED_NATIVE_RID: osx-arm64
        run: ./scripts/Test-Native.ps1 -Executable src/Plico.Desktop/bin/Release/net10.0/Plico -EvidenceDirectory artifacts/native
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-macos15-arm64
          path: artifacts/native/
          if-no-files-found: ignore
