name: Verify orientation and native launch on Intel Macs
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact OCR commit to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  orientation:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Confirm checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - run: dotnet test Plico.slnx -c Release --no-restore --filter 'FullyQualifiedName~ExpandedOcrTests|FullyQualifiedName~OcrLanguageTests'
      - name: Launch the native Plico window
        shell: pwsh
        env:
          PLICO_EXPECTED_NATIVE_RID: osx-x64
        run: ./scripts/Test-Native.ps1 -Executable src/Plico.Desktop/bin/Release/net10.0/Plico -EvidenceDirectory artifacts/native
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-orientation-${{ matrix.runner }}
          path: artifacts/native
          if-no-files-found: ignore
