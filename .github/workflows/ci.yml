name: Verify LibreOffice intake
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact feature commit to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  office:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Confirm checkout
        env:
          PLICO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$PLICO_SOURCE_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install the optional helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
      - run: dotnet restore Plico.slnx --locked-mode
      - run: dotnet test Plico.slnx -c Release --no-restore --filter FullyQualifiedName~AnOfficeImportUsesTheLocalHelperOrRetainsTheSourceForRetry
