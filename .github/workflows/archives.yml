name: Verify local model provider
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    name: Plico with Ollama (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore candidate and confirm product source
        run: |
          test "$(git rev-parse HEAD:src)" = 8220fbf6c623cc4ff4a11d15ef7af73c052e4d88
          test "$(git rev-parse HEAD:Directory.Packages.props)" = 05590f12c2b3fcfa81bd88f6a0656eed7db3e080
          dotnet restore Plico.slnx --locked-mode
      - name: Verify embedding ranking, grounded chat and confirmed filing
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NO_CLOUD: "1"
          PLICO_LIVE_MODEL_ENDPOINT: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/plico-ollama-models"
          runtime="$RUNNER_TEMP/plico-ollama"
          archive="$RUNNER_TEMP/plico-ollama.tar.zst"
          mkdir -p "$runtime"
          curl --fail --silent --show-error --location --retry 2 --output "$archive" \
            https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-linux-amd64.tar.zst
          printf '%s  %s\n' 87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d "$archive" | sha256sum --check
          tar --extract --file "$archive" --directory "$runtime" \
            --exclude='*/cuda*' --exclude='*/rocm*' --exclude='*/vulkan*'
          "$runtime/bin/ollama" serve > "$RUNNER_TEMP/plico-ollama.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -n 35 "$RUNNER_TEMP/plico-ollama.log"' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/version
          "$runtime/bin/ollama" pull all-minilm:22m
          "$runtime/bin/ollama" pull qwen2.5:0.5b
          dotnet test Plico.slnx -c Release --no-restore --filter FullyQualifiedName~LiveLocalModelVerification
