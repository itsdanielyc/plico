name: Verify release candidate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Extract and run (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, rid: osx-x64}
    env:
      PLICO_SOURCE_SHA: 3fb8754e5ae587fc32f810bc4bc8a1eec40a4e92
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PLICO_SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:PLICO_SOURCE_SHA) { throw "Expected $env:PLICO_SOURCE_SHA, got $actual" }
          Write-Output "Source commit $actual"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - name: Run solution tests
        run: dotnet test Plico.slnx -c Release --no-restore
      - name: Package and verify the archive
        shell: pwsh
        env:
          PLICO_RUNTIME: ${{ matrix.rid }}
          PLICO_EXPECTED_NATIVE_RID: ${{ matrix.rid }}
        run: |
          if ($IsWindows) {
              $compiler = ./scripts/Get-Nsis.ps1 -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'plico-nsis')
              ./scripts/Package.ps1 -Runtime $env:PLICO_RUNTIME -WindowsInstallerCompiler $compiler
          } else {
              ./scripts/Package.ps1 -Runtime $env:PLICO_RUNTIME
          }
          ./scripts/Test-Distribution.ps1 -Directory artifacts/archives -EvidenceDirectory artifacts/install
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.rid }}
          path: artifacts/archives/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-${{ matrix.rid }}
          path: artifacts/install/
          if-no-files-found: ignore
