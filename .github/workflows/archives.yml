name: Verify archives
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Extract and run (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, rid: win-x64}
          - {runner: windows-11-arm, rid: win-arm64}
          - {runner: macos-26, rid: osx-arm64}
          - {runner: macos-26-intel, rid: osx-x64}
          - {runner: ubuntu-24.04, rid: linux-x64}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - name: Package and verify the archive
        shell: pwsh
        env:
          PLICO_RUNTIME: ${{ matrix.rid }}
          PLICO_EXPECTED_NATIVE_RID: ${{ matrix.rid }}
        run: |
          if ($IsWindows) {
              $compiler = ./scripts/Get-Nsis.ps1 -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'plico-nsis')
              ./scripts/Package.ps1 -Runtime $env:PLICO_RUNTIME -WindowsInstallerCompiler $compiler
          } else {
              ./scripts/Package.ps1 -Runtime $env:PLICO_RUNTIME
          }
          ./scripts/Test-Distribution.ps1 -Directory artifacts/archives -EvidenceDirectory artifacts/install
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.rid }}
          path: artifacts/archives/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-${{ matrix.rid }}
          path: artifacts/install/
          if-no-files-found: ignore
