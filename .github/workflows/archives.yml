name: Verify integrated packages on macOS 15
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Extract and run (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, rid: osx-arm64}
          - {runner: macos-15-intel, rid: osx-x64}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a278ef56200f243a79a2a641a684acd327b2b4c5
      - name: Confirm the integrated candidate
        run: test "$(git rev-parse HEAD)" = a278ef56200f243a79a2a641a684acd327b2b4c5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Plico.slnx --locked-mode
      - name: Run solution tests
        run: dotnet test Plico.slnx -c Release --no-restore
      - name: Package and verify the archive
        shell: pwsh
        env:
          PLICO_RUNTIME: ${{ matrix.rid }}
          PLICO_EXPECTED_NATIVE_RID: ${{ matrix.rid }}
        run: |
          ./scripts/Package.ps1 -Runtime $env:PLICO_RUNTIME
          ./scripts/Test-Distribution.ps1 -Directory artifacts/archives -EvidenceDirectory artifacts/install
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.rid }}
          path: artifacts/archives/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-${{ matrix.rid }}
          path: artifacts/install/
          if-no-files-found: ignore
